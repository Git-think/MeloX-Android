name: Mirror upstream releases

# Mirrors lladlam's versioned releases (e.g. 0.6.2) onto this fork: merges
# upstream main into this fork's main (merge, never reset, so local patches
# stay on top and a conflict fails the job instead of overwriting anything),
# builds :app:assembleRelease from that result, and publishes it with the same
# tag, title, notes and prerelease flag, asset named MeloX-Android-<tag>.apk
# just like upstream. The APK SHA-256 and signing certificate fingerprint in
# the copied release notes are rewritten to this fork's actual values.
# Only the newest upstream release that is missing on this
# fork is processed per run. The merged main is intentionally not pushed here;
# pushing stays with sync-upstream.yml. The rolling `dev-latest` debug build is
# handled by build.yml / sync-upstream.yml instead.
#
# Release signing comes from repository secrets and maps onto the gradle
# properties meloxReleaseStoreFile/StorePassword/KeyAlias/KeyPassword declared
# in android/app/build.gradle.kts. Without the secrets the job fails with
# instructions instead of publishing an unsigned APK. A signed build produces
# app-release.apk while an unsigned one is app-release-unsigned.apk, so the
# publish step checks the signed file name as proof signing was applied.

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mirror-releases
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Find latest upstream release missing here
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_json=$(gh api "repos/lladlam/MeloX-Android/releases?per_page=30")
          # Only version-shaped app releases (0.6.4, android-v0.4.1-Beta, ...);
          # resource releases such as autosync-native-v1.0.0 must be skipped.
          tag=$(jq -r '[.[] | select(.draft == false) | select(.tag_name != "dev-latest") | select(.tag_name | test("^(android-)?v?[0-9]+\\.[0-9]+\\.[0-9]+"))][0].tag_name // empty' <<<"$upstream_json")
          if [ -z "$tag" ]; then
            echo "No upstream versioned release found."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "Upstream ${tag} is already mirrored on this fork."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          title=$(jq -r --arg t "$tag" '[.[] | select(.tag_name == $t)][0].name // empty' <<<"$upstream_json")
          prerelease=$(jq -r --arg t "$tag" '[.[] | select(.tag_name == $t)][0].prerelease' <<<"$upstream_json")
          jq -r --arg t "$tag" '[.[] | select(.tag_name == $t)][0].body // ""' <<<"$upstream_json" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "tag=${tag}"
            echo "title=${title}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "Will mirror upstream ${tag} (prerelease=${prerelease})."

      - name: Merge upstream main into this fork
        if: steps.find.outputs.tag != ''
        run: |
          git remote add upstream https://github.com/lladlam/MeloX-Android.git
          git fetch --no-tags upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge upstream/main --no-edit \
            -m "chore: sync upstream main before mirroring ${{ steps.find.outputs.tag }}"; then
            echo "Merge hit conflicts; auto-resolving the fork's README patches."
            python3 tools/fork_readme_resolve.py
            if git ls-files -u | grep -q .; then
              echo "::error::Unresolved conflicts remain outside the auto-resolved README files."
              git ls-files -u
              exit 1
            fi
            git commit --no-edit
          fi

      - name: Set up JDK 17
        if: steps.find.outputs.tag != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        if: steps.find.outputs.tag != ''
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        if: steps.find.outputs.tag != ''
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Build signed release APK
        if: steps.find.outputs.tag != ''
        env:
          MELOX_RELEASE_KEYSTORE_B64: ${{ secrets.MELOX_RELEASE_KEYSTORE_B64 }}
          ORG_GRADLE_PROJECT_meloxReleaseStorePassword: ${{ secrets.MELOX_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_meloxReleaseKeyAlias: ${{ secrets.MELOX_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_meloxReleaseKeyPassword: ${{ secrets.MELOX_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$MELOX_RELEASE_KEYSTORE_B64" ] || [ -z "$ORG_GRADLE_PROJECT_meloxReleaseStorePassword" ] \
            || [ -z "$ORG_GRADLE_PROJECT_meloxReleaseKeyAlias" ] || [ -z "$ORG_GRADLE_PROJECT_meloxReleaseKeyPassword" ]; then
            echo "::error::Signing secrets are missing. Add MELOX_RELEASE_KEYSTORE_B64, MELOX_RELEASE_STORE_PASSWORD, MELOX_RELEASE_KEY_ALIAS and MELOX_RELEASE_KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          keystore="$RUNNER_TEMP/melox-release.jks"
          echo "$MELOX_RELEASE_KEYSTORE_B64" | base64 -d > "$keystore"
          export ORG_GRADLE_PROJECT_meloxReleaseStoreFile="$keystore"
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2

      - name: Publish mirrored release
        if: steps.find.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.find.outputs.tag }}
          TITLE: ${{ steps.find.outputs.title }}
          PRERELEASE: ${{ steps.find.outputs.prerelease }}
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Signed app-release.apk not found; the signing config was not applied."
            ls -l android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$apk" "/tmp/MeloX-Android-${TAG}.apk"
          # The notes copied from upstream carry the upstream APK's SHA-256 and
          # release certificate fingerprint; replace both with this fork's build
          # so the published artifact section stays truthful.
          new_sha=$(sha256sum "$apk" | awk '{print $1}')
          bt="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/37.0.0"
          new_cert=$("$bt/apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*SHA-256 digest: \([0-9A-Fa-f:]*\).*/\1/p' | head -1 | tr 'a-f' 'A-F')
          if [ -z "$new_cert" ]; then
            echo "::error::Could not read the signing certificate fingerprint from $bt/apksigner."
            exit 1
          fi
          if grep -qE '[0-9a-fA-F]{64}' "$RUNNER_TEMP/release-notes.md"; then
            sed -E -i "s/[0-9a-fA-F]{64}/${new_sha}/g" "$RUNNER_TEMP/release-notes.md"
          fi
          # 上游说明里证书以 “SHA-256 `hex`” 内联格式出现；上面的摘要替换会把它
          # 一并换成 APK 摘要，这里再把它恢复成本 fork 的真实证书指纹。
          if grep -qE 'SHA-256 `[0-9a-fA-F]{64}`' "$RUNNER_TEMP/release-notes.md"; then
            sed -E -i "s/(SHA-256 \`)[0-9a-fA-F]{64}(\`)/\1${new_cert}\2/g" "$RUNNER_TEMP/release-notes.md"
          fi
          if grep -qE '([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}' "$RUNNER_TEMP/release-notes.md"; then
            sed -E -i "s/([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}/${new_cert}/g" "$RUNNER_TEMP/release-notes.md"
          fi
          grep -q "$new_sha" "$RUNNER_TEMP/release-notes.md" \
            || echo "::warning::Release notes contain no SHA-256 placeholder; left untouched."
          echo "APK sha256=${new_sha}"
          echo "APK cert SHA-256=${new_cert}"
          args=(--repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "/tmp/MeloX-Android-${TAG}.apk" "${args[@]}"

      # 合并冲突或构建/签名失败时留一条可见提示：优先创建/更新 Issue（需要仓库开启 Issues）。
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream mirror failed"
          {
            echo "## $title"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          body=$(printf 'The upstream mirror run failed (merge conflict, build, or signing).\n\nResolve it and re-run the workflow.\n\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" \
              || echo "::warning::Could not create the issue (Issues disabled?); check the failed run manually."
          fi
