name: Validate fork rewrite

# Branch-only validation. Existing fork signing/publishing workflows stay intact;
# this workflow builds the selected ref but never replaces a published release.
on:
  push:
    branches: [rewrite/third-party-sources]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Run Debug unit tests
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --stacktrace

      - name: Build signed Release
        env:
          MELOX_RELEASE_KEYSTORE_B64: ${{ secrets.MELOX_RELEASE_KEYSTORE_B64 }}
          ORG_GRADLE_PROJECT_meloxReleaseStorePassword: ${{ secrets.MELOX_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_meloxReleaseKeyAlias: ${{ secrets.MELOX_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_meloxReleaseKeyPassword: ${{ secrets.MELOX_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MELOX_RELEASE_KEYSTORE_B64"
          test -n "$ORG_GRADLE_PROJECT_meloxReleaseStorePassword"
          test -n "$ORG_GRADLE_PROJECT_meloxReleaseKeyAlias"
          test -n "$ORG_GRADLE_PROJECT_meloxReleaseKeyPassword"
          keystore="$RUNNER_TEMP/melox-verify.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$MELOX_RELEASE_KEYSTORE_B64" | base64 -d > "$keystore"
          export ORG_GRADLE_PROJECT_meloxReleaseStoreFile="$keystore"
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --stacktrace

      - name: Verify certificate and APK metadata
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-universal-release.apk"
          test -f "$apk"
          bt="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/37.0.0"
          cert=$("$bt/apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*SHA-256 digest: \([0-9A-Fa-f:]*\).*/\1/p' | head -1 | tr 'a-f' 'A-F')
          test "$cert" = '6FC4DE2B0730BE565875E93B897640936E60F9AF38718638CCCDDD2E825E2A42'
          "$bt/aapt" dump badging "$apk" | sed -n '1p'
          mkdir -p verification
          cp "$apk" verification/MeloX-Android-rewrite-signed.apk
          sha256sum verification/MeloX-Android-rewrite-signed.apk > verification/SHA256SUMS.txt
          {
            echo "Revision: $GITHUB_SHA"
            echo "Certificate SHA-256: $cert"
            cat verification/SHA256SUMS.txt
            echo 'Build/tests are not an on-device playback or thermal test.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed validation APK
        uses: actions/upload-artifact@v4
        with:
          name: MeloX-Android-rewrite-signed
          path: verification/
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-rewrite-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          retention-days: 7
